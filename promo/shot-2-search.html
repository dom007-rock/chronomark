<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 800px;
    background: #e2e5ea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  .browser {
    width: 1180px;
    height: 720px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
  }
  .browser-top {
    height: 52px;
    background: #eceef2;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    border-bottom: 1px solid #dcdfe4;
    flex-shrink: 0;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .addr {
    flex: 1;
    max-width: 480px;
    height: 30px;
    background: #fff;
    border-radius: 15px;
    border: 1px solid #dcdfe4;
    display: flex;
    align-items: center;
    padding: 0 14px;
    color: #6b7280;
    font-size: 13px;
  }
  .browser-body {
    position: relative;
    flex: 1;
    background: #f4f5f7;
  }
  .placeholder-block {
    position: absolute;
    background: #e6e8ec;
    border-radius: 6px;
  }
  .popup-anchor {
    position: absolute;
    top: 24px;
    right: 48px;
  }

  .shell {
    font: 14px/1.4 Arial, sans-serif;
    width: 340px;
    padding: 14px;
    background: #f0f1f4;
    border-radius: 16px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.22);
  }
  .shell h1 { font-size: 15px; margin: 0 0 8px; }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 20px;
    padding: 7px 12px;
    margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
  }
  .search-icon { font-size: 14px; opacity: 0.55; }
  .search-bar input { border: none; outline: none; background: transparent; flex: 1; font: inherit; font-size: 13px; color: #333; }
  .search-clear { opacity: 0.5; font-size: 13px; padding: 0 2px; }
  .search-result {
    background: #fff;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .search-result-title {
    display: block;
    color: #1a0dab;
    text-decoration: none;
    font-size: 13px;
  }
  .search-result-meta {
    font-size: 11px;
    color: #888;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="browser">
    <div class="browser-top">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="addr">example.com</div>
    </div>
    <div class="browser-body">
      <div class="placeholder-block" style="top:40px; left:40px; width:140px; height:16px;"></div>
      <div class="placeholder-block" style="top:80px; left:40px; width:320px; height:220px;"></div>
      <div class="placeholder-block" style="top:80px; left:380px; width:320px; height:220px;"></div>

      <div class="popup-anchor">
        <div class="shell">
          <h1>Chronomark</h1>
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" value="pasta recipes">
            <span class="search-clear">✕</span>
          </div>
          <div id="searchResults">
            <div class="search-result">
              <a class="search-result-title">20-Minute Weeknight Pasta Recipes</a>
              <div class="search-result-meta">2026 / March — cooking.example.com/weeknight-pasta</div>
            </div>
            <div class="search-result">
              <a class="search-result-title">Simple Homemade Pasta Dough Guide</a>
              <div class="search-result-meta">2025 / November — baking.example.com/pasta-dough</div>
            </div>
            <div class="search-result">
              <a class="search-result-title">Best Vegetarian Pasta Bakes</a>
              <div class="search-result-meta">Bookmarks bar — foodblog.example.com/veg-pasta-bakes</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

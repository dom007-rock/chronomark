<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background-color: #fbf3e3;
    background-image: radial-gradient(circle, rgba(79,70,229,0.12) 1px, transparent 1px);
    background-size: 18px 18px;
    font-family: 'Kalam', cursive;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame { position: relative; width: 404px; height: 244px; display: flex; align-items: center; justify-content: center; gap: 22px; }
  .frame-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .icon-wrap { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
  .folder-stack { position: absolute; width: 42px; height: 42px; }
  .icon { position: absolute; top: 0; left: 0; width: 92px; height: 92px; transform: rotate(-8deg); filter: drop-shadow(4px 5px 0px rgba(67,56,202,0.22)); }
  .text { text-align: left; }
  .name { font-size: 42px; font-weight: 700; color: #4338ca; margin: 0; line-height: 1; }
  .underline { width: 150px; height: 14px; margin: 2px 0 6px; display: block; }
  .tagline { font-size: 16px; font-weight: 400; color: #44403c; line-height: 1.35; margin: 0; max-width: 210px; }
</style>
</head>
<body>
  <div class="frame">
    <svg class="frame-border" viewBox="0 0 404 244">
      <defs>
        <filter id="wobbleSmall">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
        </filter>
      </defs>
      <rect x="5" y="5" width="394" height="234" rx="20" fill="none" stroke="#4338ca" stroke-width="3" filter="url(#wobbleSmall)"/>
    </svg>

    <div class="icon-wrap">
      <svg class="folder-stack" style="top:40px; left:60px; transform: rotate(14deg);" viewBox="0 0 24 24" fill="#fbf3e3" stroke="#8b85f0" stroke-width="2" stroke-linejoin="round">
        <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleSmall)"/>
      </svg>
      <svg class="folder-stack" style="top:50px; left:66px; transform: rotate(-8deg);" viewBox="0 0 24 24" fill="#f3f0ff" stroke="#6a61e0" stroke-width="2" stroke-linejoin="round">
        <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleSmall)"/>
      </svg>
      <svg class="icon" viewBox="0 0 100 100">
        <rect x="8" y="8" width="84" height="84" rx="18" fill="#fbf3e3" stroke="#4338ca" stroke-width="3" filter="url(#wobbleSmall)"/>
        <path d="M32,22 L64,22 L64,52 L48,68 L32,52 Z" fill="none" stroke="#4338ca" stroke-width="3.5" stroke-linejoin="round" filter="url(#wobbleSmall)"/>
      </svg>
    </div>

    <div class="text">
      <h1 class="name">Chronomark</h1>
      <svg class="underline" viewBox="0 0 150 14">
        <path d="M2,7 Q 38,1 75,7 T 148,7" fill="none" stroke="#4338ca" stroke-width="3" stroke-linecap="round" filter="url(#wobbleSmall)"/>
      </svg>
      <p class="tagline">Organizes bookmarks by Year/Month, finds duplicates — 100% local.</p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 1400px; height: 560px; overflow: hidden; }
  body {
    background-color: #fbf3e3;
    background-image: radial-gradient(circle, rgba(79,70,229,0.12) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: 'Kalam', cursive;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame { position: relative; width: 1320px; height: 480px; display: flex; align-items: center; justify-content: center; gap: 70px; }
  .frame-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .icon-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
  .folder-stack { position: absolute; width: 68px; height: 68px; }
  .icon { position: absolute; top: 0; left: 0; width: 160px; height: 160px; transform: rotate(-8deg); filter: drop-shadow(7px 9px 0px rgba(67,56,202,0.22)); }
  .text { text-align: left; }
  .name { font-size: 78px; font-weight: 700; color: #4338ca; margin: 0; line-height: 1; }
  .underline { width: 320px; height: 20px; margin: 4px 0 14px; display: block; }
  .tagline { font-size: 26px; font-weight: 400; color: #44403c; line-height: 1.45; margin: 0; max-width: 620px; }
  .features { display: flex; align-items: center; gap: 26px; margin-top: 20px; }
  .feature { display: flex; align-items: center; gap: 8px; color: #4338ca; font-size: 22px; font-weight: 700; }
  .feature svg { width: 26px; height: 26px; flex-shrink: 0; }
  .dot-sep { width: 6px; height: 6px; border-radius: 50%; background: #c9c2ad; }
  .doodle { position: absolute; color: #4338ca; opacity: 0.85; }
</style>
</head>
<body>
  <div class="frame">
    <svg class="frame-border" viewBox="0 0 1320 480">
      <defs>
        <filter id="wobbleM">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
        </filter>
      </defs>
      <rect x="10" y="10" width="1300" height="460" rx="26" fill="none" stroke="#4338ca" stroke-width="4" filter="url(#wobbleM)"/>
    </svg>

    <svg class="doodle" style="top:34px; left:48px; width:36px; height:36px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M6 3h12v17l-6-4-6 4V3z" filter="url(#wobbleM)"/>
    </svg>
    <svg class="doodle" style="bottom:38px; left:64px; width:32px; height:32px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="10" cy="10" r="7" filter="url(#wobbleM)"/>
      <line x1="15" y1="15" x2="21" y2="21" filter="url(#wobbleM)"/>
    </svg>
    <svg class="doodle" style="top:40px; right:56px; width:34px; height:34px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13l5 5L20 6" filter="url(#wobbleM)"/>
    </svg>
    <svg class="doodle" style="bottom:44px; right:52px; width:34px; height:34px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleM)"/>
    </svg>

    <div class="icon-wrap">
      <svg class="folder-stack" style="top:70px; left:106px; transform: rotate(14deg);" viewBox="0 0 24 24" fill="#fbf3e3" stroke="#8b85f0" stroke-width="2" stroke-linejoin="round">
        <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleM)"/>
      </svg>
      <svg class="folder-stack" style="top:90px; left:120px; transform: rotate(-8deg);" viewBox="0 0 24 24" fill="#f3f0ff" stroke="#6a61e0" stroke-width="2" stroke-linejoin="round">
        <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleM)"/>
      </svg>
      <svg class="icon" viewBox="0 0 100 100">
        <rect x="8" y="8" width="84" height="84" rx="18" fill="#fbf3e3" stroke="#4338ca" stroke-width="3" filter="url(#wobbleM)"/>
        <path d="M32,22 L64,22 L64,52 L48,68 L32,52 Z" fill="none" stroke="#4338ca" stroke-width="3.5" stroke-linejoin="round" filter="url(#wobbleM)"/>
      </svg>
    </div>

    <div class="text">
      <h1 class="name">Chronomark</h1>
      <svg class="underline" viewBox="0 0 320 20">
        <path d="M3,10 Q 80,1 160,10 T 317,10" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" filter="url(#wobbleM)"/>
      </svg>
      <p class="tagline">Organizes your bookmarks into Year/Month folders, finds duplicates, and makes everything searchable — 100% local.</p>
      <div class="features">
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleM)"/></svg>
          <span>Organize</span>
        </div>
        <span class="dot-sep"></span>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7" filter="url(#wobbleM)"/><line x1="15" y1="15" x2="21" y2="21" filter="url(#wobbleM)"/></svg>
          <span>Search</span>
        </div>
        <span class="dot-sep"></span>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5 5L20 6" filter="url(#wobbleM)"/></svg>
          <span>De-dupe</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  body {
    background-color: #fbf3e3;
    background-image:
      radial-gradient(circle, rgba(79,70,229,0.12) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: 'Kalam', cursive;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    position: relative;
    width: 1040px;
    height: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .frame-border {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .icon-wrap {
    position: relative;
    width: 130px;
    height: 130px;
    margin-bottom: 16px;
  }
  .folder-stack {
    position: absolute;
    width: 62px;
    height: 62px;
  }
  .icon {
    position: absolute;
    top: 0; left: 0;
    width: 130px;
    height: 130px;
    transform: rotate(-8deg);
    filter: drop-shadow(6px 8px 0px rgba(67,56,202,0.22));
  }
  .name {
    font-size: 82px;
    font-weight: 700;
    color: #4338ca;
    margin: 6px 0 0;
    line-height: 1;
  }
  .underline {
    width: 360px;
    height: 22px;
    margin-top: -4px;
  }
  .tagline {
    font-size: 28px;
    font-weight: 400;
    color: #44403c;
    max-width: 720px;
    line-height: 1.5;
    margin: 18px 0 0;
  }
  .features {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-top: 24px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #4338ca;
    font-size: 23px;
    font-weight: 700;
  }
  .feature svg { width: 27px; height: 27px; flex-shrink: 0; }
  .dot-sep {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c9c2ad;
  }
  .doodle {
    position: absolute;
    color: #4338ca;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="frame">
    <svg class="frame-border" viewBox="0 0 1040 560">
      <defs>
        <filter id="wobbleBig">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
        </filter>
      </defs>
      <rect x="12" y="12" width="1016" height="536" rx="28" fill="none" stroke="#4338ca" stroke-width="4" filter="url(#wobbleBig)"/>
    </svg>

    <!-- on-theme doodles: bookmark tag, folder, magnifying glass, checkmark -->
    <svg class="doodle" style="top:46px; left:76px; width:40px; height:40px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M6 3h12v17l-6-4-6 4V3z" filter="url(#wobbleBig)"/>
    </svg>
    <svg class="doodle" style="top:56px; right:82px; width:38px; height:38px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleBig)"/>
    </svg>
    <svg class="doodle" style="bottom:58px; left:104px; width:34px; height:34px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="10" cy="10" r="7" filter="url(#wobbleBig)"/>
      <line x1="15" y1="15" x2="21" y2="21" filter="url(#wobbleBig)"/>
    </svg>
    <svg class="doodle" style="bottom:64px; right:96px; width:38px; height:38px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13l5 5L20 6" filter="url(#wobbleBig)"/>
    </svg>

    <div class="content">
      <div class="icon-wrap">
        <svg class="folder-stack" style="top:58px; left:88px; width:56px; height:56px; transform: rotate(14deg);" viewBox="0 0 24 24" fill="#fbf3e3" stroke="#8b85f0" stroke-width="2" stroke-linejoin="round">
          <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleBig)"/>
        </svg>
        <svg class="folder-stack" style="top:74px; left:98px; width:58px; height:58px; transform: rotate(-8deg);" viewBox="0 0 24 24" fill="#f3f0ff" stroke="#6a61e0" stroke-width="2" stroke-linejoin="round">
          <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleBig)"/>
        </svg>
        <svg class="icon" viewBox="0 0 100 100">
          <rect x="8" y="8" width="84" height="84" rx="18" fill="#fbf3e3" stroke="#4338ca" stroke-width="3" filter="url(#wobbleBig)"/>
          <path d="M32,22 L64,22 L64,52 L48,68 L32,52 Z" fill="none" stroke="#4338ca" stroke-width="3.5" stroke-linejoin="round" filter="url(#wobbleBig)"/>
        </svg>
      </div>
      <h1 class="name">Chronomark</h1>
      <svg class="underline" viewBox="0 0 360 22">
        <path d="M4,12 Q 90,2 180,12 T 356,12" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" filter="url(#wobbleBig)"/>
      </svg>
      <p class="tagline">Organizes your bookmarks into Year/Month folders, finds duplicates, and makes everything searchable — 100% local.</p>

      <div class="features">
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleBig)"/></svg>
          <span>Organize</span>
        </div>
        <span class="dot-sep"></span>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7" filter="url(#wobbleBig)"/><line x1="15" y1="15" x2="21" y2="21" filter="url(#wobbleBig)"/></svg>
          <span>Search</span>
        </div>
        <span class="dot-sep"></span>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5 5L20 6" filter="url(#wobbleBig)"/></svg>
          <span>De-dupe</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

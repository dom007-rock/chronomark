<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background-color: #fbf3e3;
    background-image: radial-gradient(circle, rgba(79,70,229,0.12) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: 'Kalam', cursive;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame { position: relative; width: 960px; height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .frame-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; display: flex; flex-direction: column; align-items: center; }
  .icon-wrap { position: relative; width: 190px; height: 190px; margin-bottom: 26px; }
  .folder-stack { position: absolute; width: 84px; height: 84px; }
  .icon { position: absolute; top: 0; left: 0; width: 190px; height: 190px; transform: rotate(-8deg); filter: drop-shadow(8px 10px 0px rgba(67,56,202,0.22)); }
  .name { font-size: 108px; font-weight: 700; color: #4338ca; margin: 6px 0 0; line-height: 1; }
  .underline { width: 440px; height: 26px; margin-top: -4px; }
  .tagline { font-size: 34px; font-weight: 400; color: #44403c; max-width: 760px; line-height: 1.5; margin: 26px 0 0; }
  .features { display: flex; align-items: center; gap: 38px; margin-top: 34px; }
  .feature { display: flex; align-items: center; gap: 11px; color: #4338ca; font-size: 30px; font-weight: 700; }
  .feature svg { width: 34px; height: 34px; flex-shrink: 0; }
  .dot-sep { width: 9px; height: 9px; border-radius: 50%; background: #c9c2ad; }
  .doodle { position: absolute; color: #4338ca; opacity: 0.85; }
</style>
</head>
<body>
  <div class="frame">
    <svg class="frame-border" viewBox="0 0 960 900">
      <defs>
        <filter id="wobbleSq">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"/>
        </filter>
      </defs>
      <rect x="12" y="12" width="936" height="876" rx="30" fill="none" stroke="#4338ca" stroke-width="5" filter="url(#wobbleSq)"/>
    </svg>

    <svg class="doodle" style="top:64px; left:70px; width:52px; height:52px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M6 3h12v17l-6-4-6 4V3z" filter="url(#wobbleSq)"/>
    </svg>
    <svg class="doodle" style="top:78px; right:76px; width:48px; height:48px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleSq)"/>
    </svg>
    <svg class="doodle" style="bottom:80px; left:96px; width:44px; height:44px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="10" cy="10" r="7" filter="url(#wobbleSq)"/>
      <line x1="15" y1="15" x2="21" y2="21" filter="url(#wobbleSq)"/>
    </svg>
    <svg class="doodle" style="bottom:88px; right:90px; width:48px; height:48px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13l5 5L20 6" filter="url(#wobbleSq)"/>
    </svg>

    <div class="content">
      <div class="icon-wrap">
        <svg class="folder-stack" style="top:86px; left:128px; transform: rotate(14deg);" viewBox="0 0 24 24" fill="#fbf3e3" stroke="#8b85f0" stroke-width="2" stroke-linejoin="round">
          <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleSq)"/>
        </svg>
        <svg class="folder-stack" style="top:108px; left:144px; transform: rotate(-8deg);" viewBox="0 0 24 24" fill="#f3f0ff" stroke="#6a61e0" stroke-width="2" stroke-linejoin="round">
          <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleSq)"/>
        </svg>
        <svg class="icon" viewBox="0 0 100 100">
          <rect x="8" y="8" width="84" height="84" rx="18" fill="#fbf3e3" stroke="#4338ca" stroke-width="3" filter="url(#wobbleSq)"/>
          <path d="M32,22 L64,22 L64,52 L48,68 L32,52 Z" fill="none" stroke="#4338ca" stroke-width="3.5" stroke-linejoin="round" filter="url(#wobbleSq)"/>
        </svg>
      </div>
      <h1 class="name">Chronomark</h1>
      <svg class="underline" viewBox="0 0 440 26">
        <path d="M4,14 Q 110,2 220,14 T 436,14" fill="none" stroke="#4338ca" stroke-width="5" stroke-linecap="round" filter="url(#wobbleSq)"/>
      </svg>
      <p class="tagline">Organizes your bookmarks into Year/Month folders, finds duplicates, and makes everything searchable — 100% local.</p>
      <div class="features">
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" filter="url(#wobbleSq)"/></svg>
          <span>Organize</span>
        </div>
        <span class="dot-sep"></span>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7" filter="url(#wobbleSq)"/><line x1="15" y1="15" x2="21" y2="21" filter="url(#wobbleSq)"/></svg>
          <span>Search</span>
        </div>
        <span class="dot-sep"></span>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5 5L20 6" filter="url(#wobbleSq)"/></svg>
          <span>De-dupe</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

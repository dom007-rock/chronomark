<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chronomark</title>
<style>
  body {
    font: 14px/1.4 Arial, sans-serif;
    width: 300px;
    margin: 0;
    padding: 16px;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  button {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.5;
  }
  #status {
    white-space: pre-wrap;
    background: #f5f5f5;
    padding: 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-top: 10px;
    min-height: 1em;
  }
  hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 14px 0;
  }
  .hint {
    font-size: 11px;
    color: #666;
  }
</style>
</head>
<body>

<h1>Chronomark</h1>

<div id="pendingLine">Checking for new bookmarks…</div>
<button id="fileNewBtn" disabled>File new bookmarks</button>

<hr>

<button id="organizeAllBtn">Organize ALL bookmarks now</button>
<p class="hint">
  Copies bookmarks into an "Organized Bookmarks" folder (under Other
  Bookmarks), grouped by Year → Month. Your originals are never moved or
  deleted.
</p>

<div id="status"></div>

<script src="lib/organize.js"></script>
<script src="popup.js"></script>
</body>
</html>
